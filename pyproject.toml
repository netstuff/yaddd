# Workspace root (virtual project — not a package itself).
# Member distributions live under `packages/`.

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]
docs = []
linting = [
    "ruff",
    "isort",
]
testing-extra = [
    "aiosqlite",
]
typechecking = [
    "pyright>=1.1.392",
    "ty>=0.0.84",
]
all = [
  { include-group = 'dev' },
  { include-group = 'docs' },
  { include-group = 'linting' },
  { include-group = 'testing-extra' },
  { include-group = 'typechecking' },
]

[tool.uv.workspace]
members = ["packages/*", "packages/yaddd-linter"]
# The template is a self-contained skeleton meant to be copied out of this repo,
# so it resolves yaddd from PyPI instead of joining the workspace and its lock.
exclude = ["packages/yaddd-template"]

[tool.ruff]
line-length = 120
# yaddd-template is a standalone project that only lives here for convenience:
# it brings its own tooling config and must not be linted by the library rules.
extend-exclude = ["skills", "src_old", "dist", "packages/yaddd-template"]

[tool.ruff.lint]
exclude = [
  "**/tests/*.py",
]
select = [
  "E",  # pycodestyle
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "S",  # flake8-bandit
  "C4",  # flake8-comprehensions
  "T10",  # flake8-debugger
  "ERA",  # flake8-eradicate
  "G",  # flake8-logging-format
  "PT",  # flake8-pytest-style
  "Q",  # flake8-quotes
]
ignore = [
  "D",  # docstrings
  "FBT",  # boolean position of function arg. More: https://docs.astral.sh/ruff/rules/#flake8-boolean-trap-fbt
  "EM",  # Messages in exceptions
  "TRY003",  # Messages in exceptions
  "G004",  # flake8
  "C408",  # flake8
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["application"]
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"packages/yaddd/src/yaddd/testing.py" = ["S101", "PT"]  # contract-test suites: asserts and pytest fixtures by design

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/yaddd/tests", "packages/yaddd-sqlalchemy/tests", "packages/yaddd-pydantic/tests", "packages/yaddd-linter/tests"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-s -v -p no:warnings -m 'not with_db'"
env_override_existing_values = 1
env_files = [".env", ".test.env"]
log_cli = 1
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
filterwarnings = ["ignore:ssl.*is deprecated:DeprecationWarning"]
markers = [
    "with_db: mark a test that require database",
]

[tool.ty.environment]
python-version = "3.12"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["packages/yaddd/src", "packages/yaddd-sqlalchemy/src", "packages/yaddd-pydantic/src", "packages/yaddd-linter/src"]
executionEnvironments = [
    { root = "packages/yaddd", extraPaths = ["src"] },
    { root = "packages/yaddd-sqlalchemy", extraPaths = ["src", "../yaddd/src"] },
    { root = "packages/yaddd-pydantic", extraPaths = ["src", "../yaddd/src"] },
]

[tool.uv]
package = false
default-groups = ["all"]
