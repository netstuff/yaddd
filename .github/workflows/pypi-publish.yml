# Publish all workspace packages to PyPI via Trusted Publishing (OIDC).
# Requires a Trusted Publisher registered on PyPI for EACH package
# (owner: netstuff, repository: yaddd, workflow: pypi-publish.yml).

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest

    permissions:
      id-token: write  # Trusted Publishing (OIDC) to PyPI

    strategy:
      fail-fast: false
      matrix:
        package: [yaddd, yaddd-linter, yaddd-sqlalchemy, yaddd-pydantic]

    steps:
    - uses: actions/checkout@v5
    - name: Install uv and Python
      uses: astral-sh/setup-uv@v6
    - name: Build package
      run: uv build --package ${{ matrix.package }}
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
