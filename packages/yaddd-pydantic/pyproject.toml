[project]
name = "yaddd-pydantic"
description = "Pydantic v2 integration for yaddd: PydanticVO value objects as first-class model fields"
authors = [
    {name = "Yuri Andreev", email = "andreev.jr@gmail.com"},
]
license = 'MIT'
license-files = ['LICENSE']
classifiers = [
    'Development Status :: 4 - Beta',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Intended Audience :: Developers',
    'Operating System :: OS Independent',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Internet',
]
requires-python = '>=3.12'
dependencies = [
    "yaddd>=0.1",
    "pydantic>=2.10",
]
version = "0.1.0"
readme = 'README.md'

[project.urls]
Homepage = 'https://github.com/netstuff/yaddd'

[tool.uv.sources]
yaddd = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yaddd_pydantic"]
