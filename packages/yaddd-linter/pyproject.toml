[project]
name = "yaddd-linter"
version = "0.1.0"
description = "DDD-aware linter for yaddd projects."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["ddd", "linter", "yaddd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pygls>=1.3,<2",
]

[project.scripts]
yaddd-linter = "yaddd_linter.cli:main"
yaddd-linter-lsp = "yaddd_linter.lsp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yaddd_linter"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4"]

[tool.ty.environment]
python-version = "3.12"
