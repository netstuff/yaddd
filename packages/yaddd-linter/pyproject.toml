[project]
name = "yaddd-linter"
version = "0.1.0"
description = "DDD-aware linter for yaddd projects."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["ddd", "linter", "yaddd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
yaddd-linter = "yaddd_linter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yaddd_linter"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["yaddd_linter"]
