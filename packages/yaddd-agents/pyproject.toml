[project]
name = "yaddd-agents"
version = "0.1.0"
description = "Generate and verify layered AGENTS.md rules for yaddd projects."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["ddd", "agents", "ai", "yaddd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
yaddd-agents = "yaddd_agents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yaddd_agents"]
artifacts = ["src/yaddd_agents/resources/**"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4"]

[tool.ty.environment]
python-version = "3.12"
