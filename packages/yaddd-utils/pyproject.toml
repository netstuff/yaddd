[project]
name = "yaddd-utils"
description = "Utilities for yaddd: scenario inspection and Mermaid diagram generation."
authors = [
    {name = "Yuri Andreev", email = "andreev.jr@gmail.com"},
]
license = 'MIT'
license-files = ['LICENSE']
classifiers = [
    'Development Status :: 4 - Beta',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Intended Audience :: Developers',
    'Operating System :: OS Independent',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Internet',
]
requires-python = '>=3.12'
dependencies = [
    "yaddd>=0.3",
    "mermaid-py>=0.7",
]
version = "0.1.0"
readme = 'README.md'

[project.urls]
Homepage = 'https://github.com/netstuff/yaddd'

[project.scripts]
yaddd-mermaid = "yaddd_utils.mermaid.cli:main"

[tool.uv.sources]
yaddd = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yaddd_utils"]
